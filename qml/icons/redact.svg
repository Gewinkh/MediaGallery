<?xml version="1.0" encoding="UTF-8"?>
<!-- Schwärzen: drei Textzeilen, die mittlere von einem deckenden Balken
     verdeckt. Einfarbig (currentColor kennt Qts SVG-Renderer nicht) — die
     Kachel färbt das Bild über den IconProvider auf die Theme-Farbe ein. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="#000000">
    <rect x="3"  y="4"  width="18" height="2"   rx="1" opacity="0.45"/>
    <rect x="3"  y="16" width="13" height="2"   rx="1" opacity="0.45"/>
    <rect x="2.5" y="9" width="19" height="5.5" rx="1"/>
  </g>
</svg>
